<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GL Showtime</title>
    
    <!-- Open Graph Tags -->
    <meta property="og:title" content="GL Showtime" />

    <!-- Resource Hints & Priority Hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Preconnect ไปยัง Supabase เพื่อลดเวลาการเชื่อมต่อฐานข้อมูล -->

    <link rel="dns-prefetch" href="https://mchhmxkeepepvzzqvyjr.supabase.co">
    
    <!-- Priority Hints (สำหรับภาพ Hero Banner) -->
    <link rel="preload" fetchpriority="high" as="image" href="/hero-bg.jpg" type="image/jpeg">

    <!-- Google Fonts (Kanit) -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
      body { font-family: 'Kanit', sans-serif; }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased overflow-x-hidden">
    <div id="app"></div>
    
    <!-- Priority Hint ให้โหลด Script หลักของ Vue ด้วยลำดับความสำคัญสูงสุด -->
    <script type="module" src="/src/main.js" fetchpriority="high"></script>

    <!-- Instant.page: ช่วย Preload หน้าเว็บล่วงหน้าเมื่อผู้ใช้ Hover ที่ลิงก์ -->

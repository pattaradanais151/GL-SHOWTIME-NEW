<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
      fetchpriority="high"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Girl Love TH</title>

    <!-- ========================= -->
    <!-- 1. LinkedIn Insight Tag -->
    <!-- ========================= -->

    <script type="text/javascript">
      _linkedin_partner_id = "YOUR_LINKEDIN_PARTNER_ID";

      window._linkedin_data_partner_ids =
        window._linkedin_data_partner_ids || [];

      window._linkedin_data_partner_ids.push(
        _linkedin_partner_id
      );
    </script>

    <script type="text/javascript">
      (function(l) {

        if (!l) {
          window.lintrk = function(a, b) {
            window.lintrk.q.push([a, b]);
          };

          window.lintrk.q = [];
        }

        var s = document.getElementsByTagName("script")[0];

        var b = document.createElement("script");

        b.type = "text/javascript";

        /* โหลดแบบ async */
        b.async = true;

        /* Priority ต่ำ เพราะเป็น tracking */
        b.fetchPriority = "low";

        b.src =
          "https://snap.licdn.com/li.lms-analytics/insight.min.js";

        s.parentNode.insertBefore(b, s);

      })(window.lintrk);
    </script>

    <!-- ========================= -->
    <!-- 2. Google Analytics -->
    <!-- ========================= -->

    <script
      async
      fetchpriority="low"
      src="https://www.googletagmanager.com/gtag/js?id=G-0G3ZG43NQS">
    </script>

    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        dataLayer.push(arguments);
      }

      gtag('js', new Date());

      gtag('config', 'G-0G3ZG43NQS');
    </script>

    <!-- ========================= -->
    <!-- 3. LinkedIn Noscript -->
    <!-- ========================= -->

    <noscript>
      <img
        height="1"
        width="1"
        style="display:none;"
        alt=""
        src="https://px.ads.linkedin.com/collect/?pid=YOUR_LINKEDIN_PARTNER_ID&fmt=gif"
      />
    </noscript>

    <!-- ========================= -->
    <!-- 4. Cloudflare Analytics -->
    <!-- ========================= -->

    <script
      defer
      fetchpriority="low"
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "YOUR_CLOUDFLARE_TOKEN"}'>
    </script>

  </head>

  <body>

    <div id="root"></div>

    <!-- Main React App -->
    <script
      type="module"
      src="/src/main.jsx"
      fetchpriority="high">
    </script>

  </body>
</html>
